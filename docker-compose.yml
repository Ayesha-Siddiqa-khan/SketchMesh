services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sketchmesh-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://sketchmesh:sketchmesh_secret@postgres:5432/sketchmesh?schema=public
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET_NAME=sketchmesh-assets
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1
      - NEXT_PUBLIC_STORAGE_BASE_URL=http://localhost:9000/sketchmesh-assets
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: sketchmesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sketchmesh
      POSTGRES_PASSWORD: sketchmesh_secret
      POSTGRES_DB: sketchmesh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sketchmesh -d sketchmesh"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: sketchmesh-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: sketchmesh-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb local/sketchmesh-assets --ignore-existing;
      /usr/bin/mc anonymous set download local/sketchmesh-assets;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
