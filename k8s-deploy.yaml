apiVersion: apps/v1
kind: Deployment
metadata:
  name: sketchmesh-app
  labels:
    app: sketchmesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sketchmesh
  template:
    metadata:
      labels:
        app: sketchmesh
    spec:
      containers:
      - name: sketchmesh
        image: ghcr.io/ayesha-siddiqa-khan/sketchmesh:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: sketchmesh-service
spec:
  type: NodePort
  selector:
    app: sketchmesh
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 30080
